[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searxng-mcp-control"
version = "0.1.0"
description = "Control plane MCP server for SearXNG management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0"
]

[project.scripts]
searxng-mcp-control = "searxng_mcp_control.server:main"

[tool.setuptools.packages.find]
where = ["src"]
